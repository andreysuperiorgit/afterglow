    x.fillStyle = '#FFE29A'; x.fillRect(L + off, Bz - 84 * u, 8 * u, 84 * u);
    const zf = o.min ? 64 : 52, zy = o.min ? Bz - 10 * u : Bz - 30 * u; x.font = `900 italic ${zf * u}px ${FONT}`; x.strokeStyle = ink; x.lineJoin = 'round'; x.lineWidth = 7 * u; x.strokeText(ZONES[G.zone], L + 22 * u + off, zy); x.fillStyle = '#fff'; x.fillText(ZONES[G.zone], L + 22 * u + off, zy);
    if (!o.min) {
    x.font = `700 ${21 * u}px ${FONT}`; const sub = `${((G.s - G.runS) / 1000).toFixed(1)} km · ${clock(G.todOverride ?? G.tod)}`; x.lineWidth = 5 * u; x.strokeText(sub, L + 24 * u + off, Bz); x.fillStyle = '#FFE29A'; x.fillText(sub, L + 24 * u + off, Bz); }
    x.globalAlpha = 1; }
  x.restore();
  if (!o.game) return;
  const tod = G.todOverride ?? G.tod;
  x.save(); x.textBaseline = 'alphabetic';
  // speed
  const kmh = Math.round(G.v * 3.6), R = w - 40 * u, B = h - 38 * u;
  x.textAlign = 'right'; x.font = `900 italic ${120 * u}px ${FONT}`; x.lineWidth = 9 * u; x.strokeStyle = ink; x.lineJoin = 'round'; x.strokeText(String(kmh), R - 132 * u, B); x.fillStyle = '#FFF4DA'; x.fillText(String(kmh), R - 132 * u, B);
  x.font = `900 italic ${50 * u}px ${FONT}`; x.strokeText('KM/H', R, B - 6 * u); x.fillStyle = '#FFE29A'; x.fillText('KM/H', R, B - 6 * u);
  const nb = 14, lit = Math.round(G.v / MAXV * nb);
  for (let i = 0; i < nb && !o.min; i++) { const bx = R - 380 * u + i * 27 * u, bh = (10 + i * 2.2) * u, by = B - 128 * u - bh;
    x.fillStyle = i < lit ? (i > 11 ? '#FF3B5C' : i > 8 ? '#FF4F8B' : '#22D3C5') : 'rgba(42,18,56,.45)';
    x.beginPath(); x.moveTo(bx + 6 * u, by); x.lineTo(bx + 24 * u, by); x.lineTo(bx + 18 * u, by + bh); x.lineTo(bx, by + bh); x.closePath(); x.fill(); }
  // nitro
  if (!o.min) { const nw = 260 * u, nh = 14 * u, nx = R - nw, ny = B - 210 * u; x.save(); x.textAlign = 'right'; x.font = `900 italic ${18 * u}px ${FONT}`; x.lineWidth = 5 * u; x.strokeStyle = ink; x.lineJoin = 'round';
    const full = G.nitro > .98, lab = (G.boost ? 'NITRO ×2' : full ? 'NITRO READY · SHIFT' : 'NITRO').replace(TOUCH ? ' · SHIFT' : '#', ''); x.strokeText(lab, R, ny - 8 * u); x.fillStyle = G.boost ? '#7FE8FF' : full ? '#FFE29A' : '#fff'; x.fillText(lab, R, ny - 8 * u);
    x.fillStyle = 'rgba(42,18,56,.6)'; x.beginPath(); x.roundRect(nx, ny, nw, nh, nh / 2); x.fill(); const pulse = full && !G.boost ? .75 + .25 * Math.sin(G.simT * 8) : 1;
    const gr = x.createLinearGradient(nx, 0, nx + nw, 0); gr.addColorStop(0, '#5CF0FF'); gr.addColorStop(1, '#B07CFF'); x.fillStyle = gr; x.globalAlpha = pulse; x.beginPath(); x.roundRect(nx, ny, Math.max(nh, nw * G.nitro), nh, nh / 2); x.fill(); x.globalAlpha = 1;
    x.lineWidth = 2.5 * u; x.beginPath(); x.roundRect(nx, ny, nw, nh, nh / 2); x.stroke(); x.restore();
    if (TOUCH && G.state === 'play') { const hd2 = w / innerWidth, nb = NBTN(); x.save(); x.globalAlpha = G.nitro > .02 ? 1 : .45; x.fillStyle = touchNitro ? '#7FE8FF' : 'rgba(42,18,56,.55)'; x.strokeStyle = '#7FE8FF'; x.lineWidth = 3 * hd2;
      x.beginPath(); x.arc(nb.x * hd2, nb.y * hd2, nb.r * hd2, 0, 7); x.fill(); x.stroke(); x.fillStyle = touchNitro ? '#2A1238' : '#fff'; x.font = `900 italic ${20 * hd2}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('N2O', nb.x * hd2, nb.y * hd2); x.restore(); } }
  // score
  if (!o.min) {
  x.textAlign = 'right'; const sc = Math.floor(G.score).toLocaleString('en-US');
  x.font = `800 ${17 * u}px ${FONT}`; x.fillStyle = '#fff'; x.shadowColor = 'rgba(42,18,56,.85)'; x.shadowOffsetY = 2 * u; x.fillText('SCORE', R, 40 * u);
  x.font = `900 italic ${58 * u}px ${FONT}`; x.shadowOffsetY = 0; x.lineWidth = 7 * u; x.strokeText(sc, R, 96 * u); x.fillStyle = '#FFF4DA'; x.fillText(sc, R, 96 * u);
  for (let i = 0; i < 3; i++) { x.fillStyle = i < G.lives ? '#FFE29A' : 'rgba(42,18,56,.5)'; x.strokeStyle = ink; x.lineWidth = 3 * u; const lx = R - i * 34 * u - 26 * u, ly = 112 * u; x.beginPath(); x.roundRect(lx, ly, 24 * u, 11 * u, 3 * u); x.fill(); x.stroke(); }
  if (G.combo > 0) { x.font = `800 italic ${22 * u}px ${FONT}`; x.fillStyle = '#FF4F8B'; x.lineWidth = 5 * u; x.strokeText(`COMBO ×${G.combo}`, R, 156 * u); x.fillText(`COMBO ×${G.combo}`, R, 156 * u);
    x.fillStyle = 'rgba(42,18,56,.5)'; x.fillRect(R - 120 * u, 164 * u, 120 * u, 5 * u); x.fillStyle = '#FF4F8B'; x.fillRect(R - 120 * u, 164 * u, 120 * u * clamp(G.comboT / 3.2, 0, 1), 5 * u); }
  }
  // popups
  x.textAlign = 'center';
  G.pops.forEach((p, pi) => { const a = 1 - sstep(1.1, 1.6, p.t), sc2 = 1 + (1 - sstep(0, .18, p.t)) * .6, y = h * .3 - p.t * 30 * u - (G.pops.length - 1 - pi) * 112 * u;
    x.globalAlpha = a; x.font = `900 italic ${64 * u * sc2}px ${FONT}`; x.lineWidth = 9 * u; x.strokeText(p.txt, w / 2, y); x.fillStyle = p.red ? '#FF3B5C' : '#FFE29A'; x.fillText(p.txt, w / 2, y);
    if (p.sub) { x.font = `900 italic ${44 * u}px ${FONT}`; x.lineWidth = 7 * u; x.strokeText(p.sub, w / 2, y + 54 * u); x.fillStyle = '#fff'; x.fillText(p.sub, w / 2, y + 54 * u); } });
  x.globalAlpha = 1;
  if (G.state === 'play' && (G.s - G.runS) < 700 && !o.min) { x.font = `700 ${20 * u}px ${FONT}`; x.fillStyle = 'rgba(255,255,255,.88)'; x.fillText(TOUCH ? 'hold left / right to steer · two fingers to brake · N2O = nitro' : 'close calls fill NITRO · hold SHIFT to burn it · P photo mode', w / 2, h * .17); }
  x.restore();
}

// ---------- frame ----------
function render(night, o = {}) {
  postMat.uniforms.uTime.value = G.simT; postMat.uniforms.uSpd.value = Math.min(1.6, sstep(50, 90, G.v) + G.boostK * .6); postMat.uniforms.uImp.value = G.imp > .5 ? 1 : 0; postMat.uniforms.uFade.value = o.fade || 0; postMat.uniforms.uRain.value = G.rain;
  renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  drawHUD(o);
}
function todForRun() { if (G.state === 'title') return .22 + .05 * Math.sin(G.simT * .05); return clamp(.08 + (G.s - G.runS) / 5400, 0, 1); }

// ---------- capture director (trailer) ----------
const SHOTS = [
  { t: 0, d: 3.0, cam: 'pass_rear', tod: [.18, .22], game: 1, zone: 0, pd: 0, v: 268, cars: [[13, -14, -2.95]] },
  { t: 3.0, d: 3.0, cam: 'sun_rear', tod: [.26, .3], game: 1, clear: 1, zone: 1, pd: 0, v: 276 },
  { t: 6.0, d: 2.8, cam: 'drone', tod: [.5, .55], game: 1, clear: 1, zone: 4, pd: 0, v: 289, cars: [[14, -4, 2.9]] },
  { t: 8.8, d: 2.6, cam: 'side', tod: [.64, .68], game: 1, zone: 2 },
  { t: 11.4, d: 2.8, cam: 'front3q', tod: [.76, .8], game: 1, clear: 1, v: 247, lights: [11.9, 1], zone: 3 },
  { t: 14.2, d: 2.8, cam: 'rain_low', tod: [.88, .92], game: 1, v: 238, clear: 1, zone: 5, rain: 1, pd: 0 },
  { t: 17.0, d: 3.0, cam: 'pass_front', tod: [.97, 1], game: 1, zone: 6, rain: 1, pd: 0, combo: 1, v: 302, cars: [null, [5, -9, 2.95]] },
  { t: 20.0, d: 4.0, cam: 'drone_end', tod: [1, 1], game: 0, title: 20.6, noGlow: 1 },
];
const DUR = 24;
window.__events = { dur: DUR, shots: SHOTS.map(s => ({ t: s.t, cam: s.cam })) };
function applyCars(sh, lt) {
  const si = SHOTS.indexOf(sh); if (G._shot !== si) { G._shot = si; G.pops = []; }
  traffic.forEach((c, i) => { const cfg = sh.cars && sh.cars[i - 12]; if (!cfg) { if (c.forced) { c.forced = false; c.on = false; } return; }
    if (c.forcedShot !== si) { c.forcedShot = si; c.passed = false; c.hit = false; if (sh.combo) { G.combo = sh.combo; G.comboT = 9; } }
    c.forced = true; c.on = true; c.s = G.s + lerp(cfg[0], cfg[1], clamp(lt / sh.d, 0, 1)); const sd = G.d > .5 ? -1 : 1; let want = G.d + cfg[2] * sd; if (Math.abs(want) > HALF - 1.1) want = G.d - cfg[2] * sd; c.d = want; c.lane = 1; c.tl = 0; c.v = G.v * .55; });
  if (sh.cars || (sh.clear && sh.game)) { G.v = sh.v ? sh.v / 3.6 : Math.max(G.v, 78); if (sh.combo) G.comboT = Math.max(G.comboT, 2); traffic.forEach(c => { if (!c.forced && c.on && Math.abs(c.s - G.s) < 120) c.on = false; }); G.pops = G.pops.filter(p => p.src); }
}
function capFrame(T) {
  if (T < G.simT - 1e-6) { resetWorld(86); camInit = false; }
  const dt = 1 / 60;
  while (G.simT + dt <= T + 1e-6) { const s2 = SHOTS.filter(x => x.t <= G.simT + 1e-6).pop() || SHOTS[0]; if (s2.pd != null) G.d = s2.pd; applyCars(s2, G.simT - s2.t); G.state = s2.game ? 'play' : 'title'; G.lives = 3; step(dt); updateChunks(G.s, true); }
  const sh = SHOTS.filter(s => s.t <= T + 1e-6).pop() || SHOTS[0]; const lt = T - sh.t;
  G.todOverride = lerp(sh.tod[0], sh.tod[1], clamp(lt / sh.d, 0, 1)); G.lightsAuto = false;
  G.lights = G.todOverride > .7 && !(sh.lights && T < sh.lights[0]);
  G.lightsK = G.lights ? (sh.lights && T < sh.lights[0] + .7 ? sstep(sh.lights[0], sh.lights[0] + .6, T) : 1) : 0;
  if (sh.zone != null) { G.zone = sh.zone; G.zoneT = lt + .2; } else G.zone = -1;
  if (sh.pd != null) { G.d = sh.pd; G.vd = 0; G.steer = 0; } G.state = sh.game ? 'play' : 'title'; G.lives = 3; G.hideNear = !!sh.clear; G.noGlow = !!sh.noGlow; G.rain = sh.rain ? 1 : 0;
  if (T < 3) G.score = 0;
  applyCars(sh, lt);
  updateCamera(0, { cam: sh.cam, t: lt });
  const night = syncWorld(0); G.lightsK = G.lights ? (sh.lights && T < sh.lights[0] + .7 ? sstep(sh.lights[0], sh.lights[0] + .6, T) : 1) : 0;
  placeCar(0); updateCamera(0, { cam: sh.cam, t: lt }); syncWorld(0);
  city.visible = !sh.title; render(night, { game: sh.game, min: true, brand: true, lines: sh.title ? 0 : 1, hook: sh.hook ? clamp((T - .25) / 2.6, 0, 1) : 0, title: sh.title ? clamp((T - sh.title) / 1, 0, 1) : 0, fade: T > DUR - .5 ? (T - DUR + .5) * 2 : (T < .25 ? 1 - T * 4 : 0) });
}
window.renderAt = T => capFrame(T);
window.__g = G; window.__tr = traffic; window.__snd = () => AC ? { state: AC.state, loops: SND.L.filter(o => o.src).length, sfx: Object.keys(SND.buf), voices: SND.P.length, eng: +SND.eng.gain.value.toFixed(2), master: +SND.master.gain.value.toFixed(2), rate: SND.L.map(o => o.src ? +o.src.playbackRate.value.toFixed(2) : 0), pass: SND.P.map(v => +v.g.gain.value.toFixed(2)), gear: SND.gear } : null;
window.__dbg = { scene, renderer, sun, car, camera, M };

// ---------- boot ----------
resize(); addEventListener('resize', () => { if (!CAP) resize(); });
resetWorld(86); updateChunks(G.s, true);
for (let i = 0; i < 30; i++) { step(1 / 60); }
updateChunks(G.s, true);
if (CAP) { G.simT = 1e9; capFrame(0); window.__ready = true; }
else {
  let last = performance.now(), acc = 0, fpsA = 60, slow = 0;

}
